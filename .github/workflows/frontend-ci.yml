name: Frontend CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/frontend-ci.yml"
      - ".editorconfig"
      - "application/WebSolution/websolution.client/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/frontend-ci.yml"
      - ".editorconfig"
      - "application/WebSolution/websolution.client/**"

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate frontend
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: application/WebSolution/websolution.client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: application/WebSolution/websolution.client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend checks
        run: npm run check

      - name: Build frontend
        run: npm run build
